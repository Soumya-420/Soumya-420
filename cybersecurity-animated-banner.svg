<svg width="1400" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 280">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cyan glow -->
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="280" fill="url(#darkBg)"/>
  
  <!-- Hexagon pattern background -->
  <g opacity="0.1">
    <pattern id="hexPattern" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 52,13 52,39 30,52 8,39 8,13" fill="none" stroke="#00FFFB" stroke-width="1"/>
    </pattern>
    <rect width="1400" height="280" fill="url(#hexPattern)"/>
  </g>
  
  <!-- Connection lines (circuit board style) -->
  <g stroke="#00FFFB" stroke-width="2" fill="none" opacity="0.6">
    <!-- Main horizontal line -->
    <path d="M 50,140 L 1350,140">
      <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Connecting branches -->
    <path d="M 180,140 L 180,80" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 420,140 L 420,200" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 700,140 L 700,80" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 980,140 L 980,200" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 1220,140 L 1220,80" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1.15s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Circuit nodes -->
  <g fill="#00FFFB" filter="url(#cyanGlow)">
    <circle cx="180" cy="140" r="4">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="140" r="4">
      <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="140" r="4">
      <animate attributeName="r" values="4;6;4" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="140" r="4">
      <animate attributeName="r" values="4;6;4" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1220" cy="140" r="4">
      <animate attributeName="r" values="4;6;4" dur="2.15s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Shield Icon (Left) -->
  <g transform="translate(180, 80)" filter="url(#strongGlow)">
    <path d="M0,-35 L-20,-25 L-20,10 Q-20,30 0,40 Q20,30 20,10 L20,-25 Z" 
          fill="#0a0e27" stroke="#00FFFB" stroke-width="3"/>
    <path d="M-8,0 L-3,8 L8,-8" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;1;1;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="55" font-family="Arial" font-size="11" fill="#00FFFB" text-anchor="middle" opacity="0.8">SECURE</text>
  </g>
  
  <!-- Laptop with Code -->
  <g transform="translate(420, 200)" filter="url(#strongGlow)">
    <rect x="-40" y="-30" width="80" height="50" rx="2" fill="#0a0e27" stroke="#00FFFB" stroke-width="2.5"/>
    <rect x="-35" y="-25" width="70" height="40" fill="#1a1a2e"/>
    <!-- Code lines -->
    <line x1="-30" y1="-18" x2="-10" y2="-18" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="-30" y1="-10" x2="5" y2="-10" stroke="#00FFFB" stroke-width="1.5"/>
    <line x1="-30" y1="-2" x2="-5" y2="-2" stroke="#ff3366" stroke-width="1.5"/>
    <line x1="-30" y1="6" x2="10" y2="6" stroke="#00FFFB" stroke-width="1.5"/>
    <!-- Cursor blink -->
    <rect x="12" y="3" width="2" height="8" fill="#00FFFB">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- Laptop base -->
    <path d="M-45,20 L-40,20 L-40,22 L40,22 L40,20 L45,20 L42,28 L-42,28 Z" fill="#0a0e27" stroke="#00FFFB" stroke-width="2"/>
    <text x="0" y="45" font-family="Arial" font-size="11" fill="#00FFFB" text-anchor="middle" opacity="0.8">CODE</text>
  </g>
  
  <!-- Central Server/Database -->
  <g transform="translate(700, 80)" filter="url(#strongGlow)">
    <rect x="-30" y="-35" width="60" height="70" rx="4" fill="#0a0e27" stroke="#00FFFB" stroke-width="3"/>
    <!-- Server sections -->
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke="#00FFFB" stroke-width="2"/>
    <line x1="-25" y1="5" x2="25" y2="5" stroke="#00FFFB" stroke-width="2"/>
    <line x1="-25" y1="25" x2="25" y2="25" stroke="#00FFFB" stroke-width="2"/>
    <!-- Status lights -->
    <circle cx="18" cy="-25" r="3" fill="#00ff88">
      <animate attributeName="fill" values="#00ff88;#00FFFB;#00ff88" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="-5" r="3" fill="#00ff88">
      <animate attributeName="fill" values="#00ff88;#00FFFB;#00ff88" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="15" r="3" fill="#00ff88">
      <animate attributeName="fill" values="#00ff88;#00FFFB;#00ff88" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="55" font-family="Arial" font-size="11" fill="#00FFFB" text-anchor="middle" opacity="0.8">SERVER</text>
  </g>
  
  <!-- Firewall -->
  <g transform="translate(980, 200)" filter="url(#strongGlow)">
    <rect x="-35" y="-30" width="70" height="60" rx="3" fill="#0a0e27" stroke="#ff3366" stroke-width="3"/>
    <!-- Brick pattern -->
    <g stroke="#ff3366" stroke-width="1.5" opacity="0.7">
      <line x1="-30" y1="-20" x2="30" y2="-20"/>
      <line x1="-30" y1="-10" x2="30" y2="-10"/>
      <line x1="-30" y1="0" x2="30" y2="0"/>
      <line x1="-30" y1="10" x2="30" y2="10"/>
      <line x1="-30" y1="20" x2="30" y2="20"/>
      <line x1="-15" y1="-25" x2="-15" y2="-20"/>
      <line x1="0" y1="-20" x2="0" y2="-10"/>
      <line x1="15" y1="-25" x2="15" y2="-20"/>
      <line x1="-15" y1="-10" x2="-15" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="15" y1="-10" x2="15" y2="0"/>
      <line x1="-15" y1="10" x2="-15" y2="20"/>
      <line x1="15" y1="10" x2="15" y2="20"/>
    </g>
    <!-- Shield icon overlay -->
    <path d="M-10,-5 L-10,5 L0,10 L10,5 L10,-5 L0,-10 Z" fill="none" stroke="#ff3366" stroke-width="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="48" font-family="Arial" font-size="11" fill="#ff3366" text-anchor="middle" opacity="0.8">FIREWALL</text>
  </g>
  
  <!-- Lock/Encryption -->
  <g transform="translate(1220, 80)" filter="url(#strongGlow)">
    <rect x="-18" y="-5" width="36" height="30" rx="3" fill="#0a0e27" stroke="#00FFFB" stroke-width="3"/>
    <path d="M-12,-15 Q-12,-25 0,-25 Q12,-25 12,-15 L12,-5" fill="none" stroke="#00FFFB" stroke-width="3"/>
    <circle cx="0" cy="10" r="4" fill="#00FFFB">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="14" x2="0" y2="20" stroke="#00FFFB" stroke-width="2"/>
    <text x="0" y="50" font-family="Arial" font-size="11" fill="#00FFFB" text-anchor="middle" opacity="0.8">ENCRYPT</text>
  </g>
  
  <!-- Title -->
  <text x="700" y="35" font-family="'Courier New', monospace" font-size="36" font-weight="bold" 
        fill="#00FFFB" text-anchor="middle" filter="url(#strongGlow)" letter-spacing="3">
    CYBERSECURITY PROFESSIONAL
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  
  <!-- Subtitle -->
  <text x="700" y="260" font-family="'Courier New', monospace" font-size="14" 
        fill="#00ff88" text-anchor="middle" opacity="0.9" font-style="italic">
    &lt; Securing the Digital Frontier /&gt;
    <animate attributeName="opacity" values="0;0.9" dur="2s" fill="freeze"/>
  </text>
  
  <!-- Data packets flowing -->
  <g>
    <rect x="0" y="138" width="8" height="4" fill="#00FFFB" opacity="0.8">
      <animate attributeName="x" from="50" to="1350" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="138" width="8" height="4" fill="#00ff88" opacity="0.8">
      <animate attributeName="x" from="50" to="1350" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="138" width="8" height="4" fill="#ff3366" opacity="0.8">
      <animate attributeName="x" from="50" to="1350" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
