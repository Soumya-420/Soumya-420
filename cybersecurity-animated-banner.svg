<svg width="1400" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300">
  <defs>
    <!-- Gradient Backgrounds -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Pulse Animation -->
    <filter id="pulse">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Circuit Board Pattern -->
  <g opacity="0.3">
    <!-- Horizontal Lines -->
    <line x1="0" y1="50" x2="1400" y2="50" stroke="#00FFFB" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="150" x2="1400" y2="150" stroke="#00FFFB" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="250" x2="1400" y2="250" stroke="#00FFFB" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
    </line>
    
    <!-- Vertical Lines -->
    <line x1="200" y1="0" x2="200" y2="300" stroke="#00FFFB" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="0" x2="500" y2="300" stroke="#00FFFB" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.8s" repeatCount="indefinite"/>
    </line>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#00FFFB" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.3s" repeatCount="indefinite"/>
    </line>
    <line x1="1100" y1="0" x2="1100" y2="300" stroke="#00FFFB" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.6s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Shield Icon (Left) -->
  <g transform="translate(100, 120)" filter="url(#glow)">
    <path d="M0,-40 L-25,-30 L-25,10 Q-25,35 0,50 Q25,35 25,10 L25,-30 Z" 
          fill="none" stroke="#00FFFB" stroke-width="3">
      <animate attributeName="stroke" values="#00FFFB;#00d4ff;#00FFFB" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M-10,0 L-5,10 L10,-5" fill="none" stroke="#00FFFB" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Lock Icon -->
  <g transform="translate(300, 150)" filter="url(#pulse)">
    <rect x="-15" y="0" width="30" height="25" rx="3" fill="none" stroke="#00FFFB" stroke-width="2.5"/>
    <path d="M-10,-10 Q-10,-20 0,-20 Q10,-20 10,-10 L10,0" fill="none" stroke="#00FFFB" stroke-width="2.5"/>
    <circle cx="0" cy="12" r="3" fill="#00FFFB">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Server Rack -->
  <g transform="translate(500, 130)" filter="url(#glow)">
    <rect x="-25" y="-30" width="50" height="60" rx="3" fill="none" stroke="#00FFFB" stroke-width="2.5"/>
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#00FFFB" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#00FFFB" stroke-width="2"/>
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#00FFFB" stroke-width="2"/>
    <circle cx="15" cy="-20" r="2" fill="#00ff00">
      <animate attributeName="fill" values="#00ff00;#00FFFB;#00ff00" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="-5" r="2" fill="#00ff00">
      <animate attributeName="fill" values="#00ff00;#00FFFB;#00ff00" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="10" r="2" fill="#00ff00">
      <animate attributeName="fill" values="#00ff00;#00FFFB;#00ff00" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Firewall -->
  <g transform="translate(700, 150)" filter="url(#glow)">
    <rect x="-30" y="-35" width="60" height="70" fill="none" stroke="#00FFFB" stroke-width="2.5" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </rect>
    <path d="M-20,-25 L-20,25 M-10,-25 L-10,25 M0,-25 L0,25 M10,-25 L10,25 M20,-25 L20,25" 
          stroke="#00FFFB" stroke-width="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Bug/Vulnerability Scanner -->
  <g transform="translate(900, 140)" filter="url(#pulse)">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="none" stroke="#ff3366" stroke-width="2.5"/>
    <circle cx="-8" cy="-5" r="3" fill="#ff3366"/>
    <circle cx="8" cy="-5" r="3" fill="#ff3366"/>
    <path d="M-20,-8 L-30,-15 M20,-8 L30,-15 M-20,8 L-30,15 M20,8 L30,15" 
          stroke="#ff3366" stroke-width="2"/>
    <line x1="-35" y1="0" x2="-45" y2="0" stroke="#00FFFB" stroke-width="2" opacity="0.7">
      <animate attributeName="x2" values="-45;-55;-45" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Encryption Key -->
  <g transform="translate(1100, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00FFFB" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#00FFFB" stroke-width="2"/>
    <rect x="8" y="-3" width="25" height="6" fill="none" stroke="#00FFFB" stroke-width="2.5"/>
    <rect x="20" y="-8" width="3" height="5" fill="#00FFFB"/>
    <rect x="28" y="-8" width="3" height="5" fill="#00FFFB"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </g>
  
  <!-- Fingerprint Scanner -->
  <g transform="translate(1300, 150)" filter="url(#pulse)">
    <path d="M-15,-20 Q-15,-30 -5,-30 Q5,-30 5,-20" fill="none" stroke="#00FFFB" stroke-width="2"/>
    <path d="M-10,-15 Q-10,-22 0,-22 Q10,-22 10,-15" fill="none" stroke="#00FFFB" stroke-width="2"/>
    <path d="M-5,-10 Q-5,-15 0,-15 Q5,-15 5,-10" fill="none" stroke="#00FFFB" stroke-width="2"/>
    <path d="M-15,0 Q-15,10 -5,15" fill="none" stroke="#00FFFB" stroke-width="2"/>
    <path d="M-10,5 Q-10,12 0,15" fill="none" stroke="#00FFFB" stroke-width="2"/>
    <path d="M5,0 Q5,10 15,15" fill="none" stroke="#00FFFB" stroke-width="2"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </g>
  
  <!-- Data Flow Particles -->
  <g opacity="0.8">
    <circle cx="0" cy="150" r="3" fill="#00FFFB">
      <animate attributeName="cx" from="0" to="1400" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="50" r="3" fill="#00d4ff">
      <animate attributeName="cx" from="0" to="1400" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="250" r="3" fill="#00FFFB">
      <animate attributeName="cx" from="0" to="1400" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title Text -->
  <text x="700" y="40" font-family="'Courier New', monospace" font-size="32" font-weight="bold" 
        fill="#00FFFB" text-anchor="middle" filter="url(#glow)">
    CYBERSECURITY PROFESSIONAL
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  
  <!-- Subtitle -->
  <text x="700" y="270" font-family="'Courier New', monospace" font-size="16" 
        fill="#00FFFB" text-anchor="middle" opacity="0.8">
    &lt;/&gt; Guardian of the Digital Frontier
    <animate attributeName="opacity" values="0;0.8" dur="2s" fill="freeze"/>
  </text>
  
  <!-- Scanning Line Effect -->
  <line x1="0" y1="0" x2="0" y2="300" stroke="#00FFFB" stroke-width="2" opacity="0.5">
    <animate attributeName="x1" from="0" to="1400" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="0" to="1400" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
