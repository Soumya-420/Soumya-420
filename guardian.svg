<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyber Gradient for Text Fill -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f260;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0575e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91d73;stop-opacity:1" />
    </linearGradient>

    <!-- Strong Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .text-body {
        font-family: 'Verdana', sans-serif;
        font-weight: 900;
        font-size: 70px;
        text-transform: uppercase;
        fill: url(#cyberGrad);
        stroke: #ffffff;
        stroke-width: 1px;
        filter: url(#neonGlow);
        animation: pulse 3s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { opacity: 0.8; filter: drop-shadow(0 0 5px rgba(5, 117, 230, 0.5)); }
        100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(0, 242, 96, 0.8)); }
      }
    </style>
  </defs>
  
  <!-- Just the Name -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="text-body">
    Soumyadeep Saha
  </text>
</svg>
