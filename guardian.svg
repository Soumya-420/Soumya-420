<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Cyber Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f260;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0575e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91d73;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glitch Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      .text-body {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 60px;
        text-transform: uppercase;
        fill: none;
        stroke: url(#neonGrad);
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#glow);
        animation: draw 4s ease-in-out infinite, pulse 4s ease-in-out infinite;
      }
      
      @keyframes draw {
        0% {
          stroke-dasharray: 0 500;
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
        50% {
          stroke-dasharray: 500 0;
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
        80% {
          stroke-dasharray: 500 0;
          stroke-dashoffset: 0;
          fill-opacity: 1;
          fill: url(#neonGrad);
        }
        100% {
          stroke-dasharray: 500 0;
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
      }

      @keyframes pulse {
          0%, 100% { filter: drop-shadow(0 0 5px rgba(5, 117, 230, 0.7)); }
          50% { filter: drop-shadow(0 0 15px rgba(0, 242, 96, 0.9)); }
      }
      
      .bg-rect {
        fill: #0d1117;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-rect" rx="15" />

  <!-- Animated Text -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="text-body">
    Guardian of the Web
  </text>
</svg>
