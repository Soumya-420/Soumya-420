<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Gradient for Earth -->
    <radialGradient id="earthGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradient for Robot Body -->
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90CAF9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Earth with floating animation -->
  <g id="earth">
    <circle cx="280" cy="80" r="40" fill="url(#earthGradient)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,-10; 0,0"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>
    <!-- Continents -->
    <path d="M 260 70 Q 270 65, 280 70 T 300 75" fill="#81C784" opacity="0.7">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,-10; 0,0"
        dur="3s"
        repeatCount="indefinite"/>
    </path>
    <ellipse cx="275" cy="85" rx="12" ry="8" fill="#81C784" opacity="0.7">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,-10; 0,0"
        dur="3s"
        repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Robot -->
  <g id="robot">
    <!-- Head -->
    <ellipse cx="200" cy="150" rx="35" ry="40" fill="url(#robotGradient)" stroke="#1976D2" stroke-width="3">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 150; -5 200 150; 5 200 150; 0 200 150"
        dur="4s"
        repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Blue accent on head -->
    <path d="M 180 140 Q 200 130, 220 140" fill="#42A5F5" opacity="0.6">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 150; -5 200 150; 5 200 150; 0 200 150"
        dur="4s"
        repeatCount="indefinite"/>
    </path>
    
    <!-- Eyes -->
    <circle cx="190" cy="145" r="8" fill="#1976D2">
      <animate attributeName="r" values="8;2;8" dur="3s" repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 150; -5 200 150; 5 200 150; 0 200 150"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="145" r="8" fill="#1976D2">
      <animate attributeName="r" values="8;2;8" dur="3s" repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 150; -5 200 150; 5 200 150; 0 200 150"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>
    
    <!-- Nose/Sensor -->
    <circle cx="200" cy="155" r="5" fill="#212121"/>
    
    <!-- Antenna -->
    <line x1="200" y1="110" x2="200" y2="95" stroke="#1976D2" stroke-width="3">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 110; -10 200 110; 10 200 110; 0 200 110"
        dur="2s"
        repeatCount="indefinite"/>
    </line>
    <circle cx="200" cy="92" r="5" fill="#FF5252">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 200 110; -10 200 110; 10 200 110; 0 200 110"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>
    
    <!-- Neck -->
    <rect x="190" y="185" width="20" height="15" fill="#424242" rx="3"/>
    
    <!-- Body -->
    <rect x="170" y="200" width="60" height="80" fill="url(#robotGradient)" stroke="#1976D2" stroke-width="3" rx="10"/>
    
    <!-- Chest panel -->
    <rect x="180" y="215" width="40" height="50" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" rx="5"/>
    <circle cx="200" cy="240" r="8" fill="#00E676">
      <animate attributeName="fill" values="#00E676;#76FF03;#00E676" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Left Arm -->
    <g id="leftArm">
      <rect x="135" y="210" width="15" height="40" fill="url(#robotGradient)" stroke="#1976D2" stroke-width="2" rx="7">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 150 210; 20 150 210; 0 150 210; -20 150 210; 0 150 210"
          dur="4s"
          repeatCount="indefinite"/>
      </rect>
      <rect x="130" y="250" width="20" height="35" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="7">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 140 250; -15 140 250; 0 140 250"
          dur="4s"
          repeatCount="indefinite"/>
      </rect>
      <!-- Left Hand -->
      <ellipse cx="140" cy="290" rx="10" ry="8" fill="#424242">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 140 290; -15 140 290; 0 140 290"
          dur="4s"
          repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Right Arm (pointing to Earth) -->
    <g id="rightArm">
      <rect x="250" y="210" width="15" height="40" fill="url(#robotGradient)" stroke="#1976D2" stroke-width="2" rx="7">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="-45 250 210; -35 250 210; -45 250 210"
          dur="3s"
          repeatCount="indefinite"/>
      </rect>
      <rect x="250" y="250" width="20" height="35" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="7">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="-60 250 250; -50 250 250; -60 250 250"
          dur="3s"
          repeatCount="indefinite"/>
      </rect>
      <!-- Right Hand -->
      <ellipse cx="260" cy="290" rx="10" ry="8" fill="#424242">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="-60 260 290; -50 260 290; -60 260 290"
          dur="3s"
          repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Waist -->
    <rect x="185" y="280" width="30" height="10" fill="#424242" rx="3"/>
    
    <!-- Left Leg -->
    <rect x="175" y="290" width="18" height="50" fill="url(#robotGradient)" stroke="#1976D2" stroke-width="2" rx="7"/>
    <rect x="173" y="340" width="22" height="45" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="7"/>
    
    <!-- Right Leg -->
    <rect x="207" y="290" width="18" height="50" fill="url(#robotGradient)" stroke="#1976D2" stroke-width="2" rx="7"/>
    <rect x="205" y="340" width="22" height="45" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="7"/>
    
    <!-- Left Foot -->
    <ellipse cx="184" cy="395" rx="18" ry="12" fill="#EF5350">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,3; 0,0"
        dur="2s"
        repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="184" cy="395" rx="12" ry="8" fill="#FF7043">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,3; 0,0"
        dur="2s"
        repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Right Foot -->
    <ellipse cx="216" cy="395" rx="18" ry="12" fill="#EF5350">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,3; 0,0"
        dur="2s"
        begin="0.5s"
        repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="216" cy="395" rx="12" ry="8" fill="#FF7043">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,3; 0,0"
        dur="2s"
        begin="0.5s"
        repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Sparkles around robot -->
  <circle cx="150" cy="180" r="3" fill="#FFD700">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="160" r="3" fill="#FFD700">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="250" r="3" fill="#00E676">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
