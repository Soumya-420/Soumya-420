<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <style>
      @keyframes spinGlobe {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      
      @keyframes wobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-2deg); }
        75% { transform: rotate(2deg); }
      }
      
      .globe-container {
        animation: wobble 2s ease-in-out infinite;
        transform-origin: 265px 135px;
      }
      
      .globe-spin {
        animation: spinGlobe 4s linear infinite;
        transform-origin: center;
      }
      
      .robot {
        animation: float 3s ease-in-out infinite;
      }
    </style>
    
    <radialGradient id="globeGrad" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#5ddbf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="#ffffff"/>

  <!-- Robot -->
  <g class="robot">
    <!-- Head -->
    <g transform="translate(200, 220)">
      <!-- Main head (white) -->
      <ellipse cx="0" cy="0" rx="42" ry="48" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Blue helmet/visor area -->
      <ellipse cx="0" cy="-15" rx="38" ry="25" fill="#4dd0e1"/>
      <path d="M -35,-8 Q 0,-35 35,-8" fill="#4dd0e1"/>
      
      <!-- Eyes (black circles) -->
      <circle cx="-15" cy="0" r="10" fill="#000000"/>
      <circle cx="15" cy="0" r="10" fill="#000000"/>
      
      <!-- Eye shine -->
      <circle cx="-12" cy="-3" r="4" fill="#ffffff" opacity="0.6"/>
      <circle cx="18" cy="-3" r="4" fill="#ffffff" opacity="0.6"/>
      
      <!-- Nose/sensor -->
      <circle cx="0" cy="8" r="6" fill="#000000"/>
      <circle cx="0" cy="8" r="4" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- Neck (black) -->
    <rect x="188" y="260" width="24" height="20" rx="4" fill="#2c2c2c"/>
    <rect x="192" y="265" width="16" height="12" fill="#4dd0e1"/>

    <!-- Body -->
    <g transform="translate(200, 330)">
      <!-- Main body (white) -->
      <rect x="-40" y="-40" width="80" height="95" rx="12" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Blue chest panel -->
      <rect x="-30" y="-30" width="60" height="75" rx="8" fill="#4dd0e1"/>
      
      <!-- Black details on chest -->
      <rect x="-22" y="-20" width="44" height="55" rx="6" fill="#2c2c2c"/>
      
      <!-- Blue inner panel -->
      <rect x="-18" y="-15" width="36" height="45" rx="4" fill="#0891b2"/>
    </g>

    <!-- Left Arm (down) -->
    <g transform="translate(200, 330)">
      <!-- Shoulder joint -->
      <circle cx="-45" cy="-30" r="10" fill="#4dd0e1"/>
      
      <!-- Upper arm -->
      <rect x="-52" y="-25" width="16" height="50" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Elbow joint -->
      <circle cx="-44" cy="28" r="8" fill="#2c2c2c"/>
      
      <!-- Forearm -->
      <rect x="-50" y="30" width="12" height="45" rx="6" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Hand (black) -->
      <ellipse cx="-44" cy="78" rx="10" ry="12" fill="#2c2c2c"/>
      
      <!-- Fingers -->
      <rect x="-48" y="85" width="3" height="12" rx="1.5" fill="#2c2c2c"/>
      <rect x="-44" y="85" width="3" height="12" rx="1.5" fill="#2c2c2c"/>
      <rect x="-40" y="85" width="3" height="12" rx="1.5" fill="#2c2c2c"/>
    </g>

    <!-- Right Arm (raised up with finger pointing - globe spinning on finger) -->
    <g transform="translate(200, 330)">
      <!-- Shoulder joint -->
      <circle cx="45" cy="-30" r="10" fill="#4dd0e1"/>
      
      <!-- Upper arm (angled up) -->
      <rect x="38" y="-120" width="16" height="95" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1" transform="rotate(-35 46 -72)"/>
      
      <!-- Elbow joint -->
      <circle cx="58" cy="-115" r="8" fill="#2c2c2c"/>
      
      <!-- Forearm (pointing straight up) -->
      <rect x="52" y="-175" width="12" height="65" rx="6" fill="#ffffff" stroke="#d0d0d0" stroke-width="1" transform="rotate(-10 58 -142)"/>
      
      <!-- Hand (black, with index finger pointing up) -->
      <g transform="translate(65, -195)">
        <ellipse cx="0" cy="0" rx="10" ry="12" fill="#2c2c2c"/>
        
        <!-- Index finger pointing straight up (globe spins on this) -->
        <rect x="-1.5" y="-22" width="3" height="24" rx="1.5" fill="#2c2c2c"/>
        <circle cx="0" cy="-23" r="2.5" fill="#2c2c2c"/>
        
        <!-- Other fingers curled -->
        <rect x="-7" y="4" width="3" height="8" rx="1.5" fill="#2c2c2c" transform="rotate(30 -5.5 8)"/>
        <rect x="-3" y="6" width="3" height="8" rx="1.5" fill="#2c2c2c" transform="rotate(15 -1.5 10)"/>
        <rect x="4" y="4" width="3" height="8" rx="1.5" fill="#2c2c2c" transform="rotate(-30 5.5 8)"/>
      </g>
    </g>

    <!-- Legs -->
    <!-- Left Leg -->
    <g transform="translate(200, 385)">
      <!-- Hip joint -->
      <circle cx="-18" cy="0" r="10" fill="#4dd0e1"/>
      
      <!-- Upper leg -->
      <rect x="-26" y="5" width="16" height="60" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Knee joint -->
      <circle cx="-18" cy="68" r="8" fill="#2c2c2c"/>
      
      <!-- Lower leg -->
      <rect x="-24" y="72" width="12" height="65" rx="6" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Ankle joint -->
      <circle cx="-18" cy="140" r="6" fill="#2c2c2c"/>
      
      <!-- Foot (red shoe) -->
      <ellipse cx="-18" cy="152" rx="16" ry="12" fill="#cc0000"/>
      <ellipse cx="-18" cy="150" rx="14" ry="10" fill="#ff3333"/>
      <ellipse cx="-22" cy="149" rx="5" ry="4" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Right Leg -->
    <g transform="translate(200, 385)">
      <!-- Hip joint -->
      <circle cx="18" cy="0" r="10" fill="#4dd0e1"/>
      
      <!-- Upper leg -->
      <rect x="10" y="5" width="16" height="60" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Knee joint -->
      <circle cx="18" cy="68" r="8" fill="#2c2c2c"/>
      
      <!-- Lower leg -->
      <rect x="12" y="72" width="12" height="65" rx="6" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
      
      <!-- Ankle joint -->
      <circle cx="18" cy="140" r="6" fill="#2c2c2c"/>
      
      <!-- Foot (red shoe) -->
      <ellipse cx="18" cy="152" rx="16" ry="12" fill="#cc0000"/>
      <ellipse cx="18" cy="150" rx="14" ry="10" fill="#ff3333"/>
      <ellipse cx="14" cy="149" rx="5" ry="4" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>

  <!-- Globe spinning ON the robot's finger -->
  <g class="globe-container">
    <g transform="translate(265, 135)">
      <g class="globe-spin">
        <!-- Globe sphere -->
        <circle cx="0" cy="0" r="50" fill="url(#globeGrad)"/>
        
        <!-- Continents in white -->
        <g fill="#ffffff" opacity="0.9">
          <!-- North America -->
          <path d="M -18,-23 L -13,-28 L -5,-26 L 0,-18 L -7,-13 L -13,-16 Z"/>
          <path d="M -10,-10 L -4,-6 L 0,-3 L -4,2 L -10,-3 Z"/>
          
          <!-- South America -->
          <path d="M -7,7 L -2,14 L -4,23 L -9,26 L -11,18 L -9,11 Z"/>
          
          <!-- Europe -->
          <path d="M 7,-23 L 13,-26 L 18,-23 L 16,-18 L 11,-16 Z"/>
          
          <!-- Africa -->
          <path d="M 7,-13 L 13,-10 L 18,-6 L 20,5 L 16,16 L 11,23 L 7,18 L 9,9 L 7,0 Z"/>
          
          <!-- Asia -->
          <path d="M 23,-18 L 32,-16 L 37,-9 L 35,0 L 30,7 L 23,4 L 26,-4 L 23,-11 Z"/>
          
          <!-- Australia -->
          <path d="M 28,16 L 32,18 L 32,23 L 26,24 L 24,20 Z"/>
        </g>
        
        <!-- Globe shine -->
        <ellipse cx="-16" cy="-16" rx="18" ry="23" fill="#ffffff" opacity="0.3"/>
      </g>
      
      <!-- Motion lines showing spinning -->
      <g opacity="0.5">
        <path d="M 52,0 L 62,-5" stroke="#4dd0e1" stroke-width="2" stroke-linecap="round">
          <animate attributeName="opacity" values="0;0.7;0" dur="1s" repeatCount="indefinite"/>
        </path>
        <path d="M 50,10 L 60,8" stroke="#4dd0e1" stroke-width="2" stroke-linecap="round">
          <animate attributeName="opacity" values="0;0.7;0" dur="1s" begin="0.25s" repeatCount="indefinite"/>
        </path>
        <path d="M 50,-10 L 60,-8" stroke="#4dd0e1" stroke-width="2" stroke-linecap="round">
          <animate attributeName="opacity" values="0;0.7;0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
