<svg width="400" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450">
  <defs>
    <!-- Gradients -->
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFB;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="eyeGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00FFFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:0.5" />
    </radialGradient>
    
    <!-- Filters -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow effect -->
  <circle cx="200" cy="200" r="150" fill="url(#cyanGlow)" opacity="0.05">
    <animate attributeName="r" values="150;160;150" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Robot -->
  <g transform="translate(200, 250)" filter="url(#shadow)">
    
    <!-- Legs -->
    <g>
      <!-- Left Leg -->
      <g transform="translate(-28, 65)">
        <rect x="-9" y="0" width="18" height="60" rx="9" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="2.5"/>
        <rect x="-7" y="15" width="14" height="10" fill="url(#cyanGlow)" opacity="0.4"/>
        <line x1="0" y1="20" x2="0" y2="30" stroke="#00FFFB" stroke-width="2" opacity="0.6">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </line>
        <!-- Foot -->
        <g transform="translate(0, 60)">
          <ellipse cx="0" cy="5" rx="18" ry="12" fill="#ffd700" stroke="#e6c200" stroke-width="2.5"/>
          <ellipse cx="0" cy="3" rx="14" ry="8" fill="#ffed4e"/>
          <ellipse cx="0" cy="1" rx="10" ry="5" fill="#fff9a3"/>
          <ellipse cx="-4" cy="0" rx="3" ry="2" fill="#ffffff" opacity="0.7"/>
        </g>
      </g>
      
      <!-- Right Leg -->
      <g transform="translate(28, 65)">
        <rect x="-9" y="0" width="18" height="60" rx="9" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="2.5"/>
        <rect x="-7" y="15" width="14" height="10" fill="url(#cyanGlow)" opacity="0.4"/>
        <line x1="0" y1="20" x2="0" y2="30" stroke="#00FFFB" stroke-width="2" opacity="0.6">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
        </line>
        <!-- Foot -->
        <g transform="translate(0, 60)">
          <ellipse cx="0" cy="5" rx="18" ry="12" fill="#ffd700" stroke="#e6c200" stroke-width="2.5"/>
          <ellipse cx="0" cy="3" rx="14" ry="8" fill="#ffed4e"/>
          <ellipse cx="0" cy="1" rx="10" ry="5" fill="#fff9a3"/>
          <ellipse cx="-4" cy="0" rx="3" ry="2" fill="#ffffff" opacity="0.7"/>
        </g>
      </g>
    </g>
    
    <!-- Torso -->
    <rect x="-40" y="0" width="80" height="70" rx="18" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="3"/>
    
    <!-- Chest Panel -->
    <rect x="-28" y="18" width="56" height="38" rx="10" fill="url(#cyanGlow)" opacity="0.2" stroke="#00FFFB" stroke-width="2.5"/>
    
    <!-- Heart/Power Core -->
    <g transform="translate(0, 37)">
      <circle cx="0" cy="0" r="10" fill="#00FFFB" filter="url(#softGlow)" opacity="0.8">
        <animate attributeName="r" values="10;12;10" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <path d="M-4,-2 L0,3 L4,-2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Left Arm (down, resting) -->
    <g transform="translate(-40, 25)">
      <!-- Upper arm -->
      <rect x="-7" y="0" width="14" height="38" rx="7" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="2.5"/>
      <rect x="-6" y="10" width="12" height="10" fill="url(#cyanGlow)" opacity="0.3"/>
      
      <!-- Lower arm -->
      <g transform="translate(0, 38)">
        <rect x="-7" y="0" width="14" height="35" rx="7" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="2.5"/>
        
        <!-- Hand (palm) -->
        <g transform="translate(0, 35)">
          <ellipse cx="0" cy="0" rx="10" ry="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2.5"/>
          <ellipse cx="0" cy="-1" rx="8" ry="6" fill="#3a3a3a"/>
          
          <!-- Thumb -->
          <g transform="translate(-8, 2)">
            <ellipse cx="0" cy="0" rx="3" ry="4" fill="#2a2a2a"/>
            <rect x="-2" y="-2" width="4" height="8" rx="2" fill="#2a2a2a" transform="rotate(-30 0 2)"/>
          </g>
          
          <!-- Fingers -->
          <g transform="translate(-5, -2)">
            <rect x="-1.5" y="0" width="3" height="12" rx="1.5" fill="#2a2a2a"/>
            <ellipse cx="0" cy="12" rx="1.5" ry="2" fill="#2a2a2a"/>
          </g>
          <g transform="translate(0, -2)">
            <rect x="-1.5" y="0" width="3" height="14" rx="1.5" fill="#2a2a2a"/>
            <ellipse cx="0" cy="14" rx="1.5" ry="2" fill="#2a2a2a"/>
          </g>
          <g transform="translate(5, -2)">
            <rect x="-1.5" y="0" width="3" height="11" rx="1.5" fill="#2a2a2a"/>
            <ellipse cx="0" cy="11" rx="1.5" ry="2" fill="#2a2a2a"/>
          </g>
        </g>
      </g>
    </g>
    
    <!-- Right Arm (RAISED UP for waving like human) -->
    <g transform="translate(40, 15)">
      <!-- Upper arm (raised horizontally) -->
      <g transform="rotate(-90 0 0)">
        <rect x="-7" y="0" width="14" height="38" rx="7" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="2.5"/>
        <rect x="-6" y="10" width="12" height="10" fill="url(#cyanGlow)" opacity="0.3"/>
        
        <!-- Forearm (pointing up) -->
        <g transform="translate(0, 38) rotate(-90 0 0)">
          <rect x="-7" y="0" width="14" height="40" rx="7" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="2.5"/>
          
          <!-- WAVING HAND (palm facing FORWARD) -->
          <g transform="translate(0, 40) rotate(-90 0 0)">
            <!-- Wrist pivot animation - side to side like human -->
            <animateTransform 
              attributeName="transform" 
              type="rotate" 
              values="-90 0 0; -120 0 0; -60 0 0; -120 0 0; -60 0 0; -90 0 0" 
              dur="2s" 
              repeatCount="indefinite"/>
            
            <!-- Palm (facing viewer) -->
            <ellipse cx="0" cy="0" rx="11" ry="9" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2.5"/>
            <ellipse cx="0" cy="-1" rx="9" ry="7" fill="#3a3a3a"/>
            <circle cx="-2" cy="-2" r="3" fill="#ffd700" opacity="0.8"/>
            
            <!-- Thumb (left side) -->
            <g transform="translate(-11, 0)">
              <rect x="-2" y="-5" width="4" height="10" rx="2" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
              <ellipse cx="0" cy="-6" rx="2" ry="2.5" fill="#2a2a2a"/>
            </g>
            
            <!-- Index Finger -->
            <g transform="translate(-6, 0)">
              <rect x="-1.8" y="-8" width="3.6" height="14" rx="1.8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
              <ellipse cx="0" cy="-9" rx="1.8" ry="2.5" fill="#2a2a2a"/>
              <circle cx="0" cy="-2" r="2" fill="#3a3a3a"/>
            </g>
            
            <!-- Middle Finger (tallest) -->
            <g transform="translate(0, 0)">
              <rect x="-1.8" y="-10" width="3.6" height="16" rx="1.8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
              <ellipse cx="0" cy="-11" rx="1.8" ry="2.5" fill="#2a2a2a"/>
              <circle cx="0" cy="-3" r="2" fill="#3a3a3a"/>
            </g>
            
            <!-- Ring Finger -->
            <g transform="translate(6, 0)">
              <rect x="-1.8" y="-8" width="3.6" height="13" rx="1.8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
              <ellipse cx="0" cy="-9" rx="1.8" ry="2.5" fill="#2a2a2a"/>
              <circle cx="0" cy="-2" r="2" fill="#3a3a3a"/>
            </g>
            
            <!-- Pinky (smallest) -->
            <g transform="translate(10, 0)">
              <rect x="-1.5" y="-6" width="3" height="10" rx="1.5" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
              <ellipse cx="0" cy="-7" rx="1.5" ry="2" fill="#2a2a2a"/>
              <circle cx="0" cy="-1" r="1.5" fill="#3a3a3a"/>
            </g>
          </g>
        </g>
      </g>
    </g>
    
    <!-- Neck -->
    <rect x="-12" y="-18" width="24" height="20" rx="6" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="2.5"/>
    <rect x="-10" y="-12" width="20" height="8" fill="#2a2a2a" opacity="0.3"/>
    
    <!-- Head -->
    <g transform="translate(0, -48)">
      <!-- Main head -->
      <ellipse cx="0" cy="0" rx="38" ry="35" fill="url(#robotBody)" stroke="#d0d0d0" stroke-width="3"/>
      
      <!-- Cyan visor/ear piece -->
      <path d="M-32,-10 Q-38,0 -32,10 L-20,14 L-20,-14 Z" fill="url(#cyanGlow)" opacity="0.7" filter="url(#softGlow)"/>
      <circle cx="-26" cy="0" r="4" fill="#00FFFB" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Eyes -->
      <g>
        <!-- Left eye -->
        <circle cx="-12" cy="-4" r="9" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
        <circle cx="-12" cy="-4" r="6" fill="url(#eyeGlow)" filter="url(#strongGlow)">
          <animate attributeName="r" values="6;5;6" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-10" cy="-6" r="2" fill="#ffffff" opacity="0.9"/>
        
        <!-- Right eye -->
        <circle cx="12" cy="-4" r="9" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
        <circle cx="12" cy="-4" r="6" fill="url(#eyeGlow)" filter="url(#strongGlow)">
          <animate attributeName="r" values="6;5;6" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14" cy="-6" r="2" fill="#ffffff" opacity="0.9"/>
      </g>
      
      <!-- Antenna -->
      <line x1="0" y1="-35" x2="0" y2="-45" stroke="#d0d0d0" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="-47" r="5" fill="#ffd700" filter="url(#softGlow)">
        <animate attributeName="fill" values="#ffd700;#00FFFB;#ffd700" dur="3s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Happy smile -->
      <path d="M-12,12 Q0,18 12,12" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10,13 Q0,17 10,13" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Floating animation -->
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite" additive="sum"/>
  
  <!-- Sparkles/Stars around robot -->
  <g opacity="0.8">
    <g transform="translate(120, 180)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#00FFFB">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <g transform="translate(280, 200)">
      <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#ffff00">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      </path>
    </g>
    
    <g transform="translate(200, 100)">
      <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" fill="#ffff00">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="1s"/>
      </path>
    </g>
  </g>
  
  <!-- "Hi!" text bubble -->
  <g transform="translate(120, 160)">
    <animate attributeName="opacity" values="0;1;1;1;0" dur="3s" repeatCount="indefinite"/>
    
    <!-- Speech bubble -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="#ffffff" stroke="#00FFFB" stroke-width="2.5" filter="url(#softGlow)"/>
    <path d="M20,15 L30,28 L25,17 Z" fill="#ffffff" stroke="#00FFFB" stroke-width="2.5"/>
    
    <!-- "Hi!" text -->
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00FFFB" text-anchor="middle">Hi!</text>
  </g>
</svg>
