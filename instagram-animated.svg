<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f09433;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#e6683c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#dc2743;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#cc2366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc1888;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="50" height="50" rx="12" fill="url(#instaGrad)" filter="url(#glow)">
    <animate attributeName="rx" values="12;15;12" dur="3s" repeatCount="indefinite" />
  </rect>
  <g fill="none" stroke="white" stroke-width="2" transform="translate(10, 10)">
    <rect x="2" y="2" width="26" height="26" rx="6" />
    <circle cx="15" cy="15" r="6" />
    <circle cx="23" cy="7" r="1.5" fill="white" stroke="none" />
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite" additive="sum" />
  </g>
</svg>
