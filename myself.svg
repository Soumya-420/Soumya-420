<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f260;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0575e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFB;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="50" font-weight="bold" 
        fill="url(#textGradient)" filter="url(#glow)">
    IT'S ME, SOUMYADEEP! 🕵️‍♂️
    <!-- SMIL Animation for blinking - GitHub supports this -->
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
  </text>
</svg>
