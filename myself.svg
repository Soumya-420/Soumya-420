<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Wave Filter -->
    <filter id="liquidWave" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" dur="5s" values="0.01 0.05; 0.01 0.1; 0.01 0.05" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
      
      .blink-liquid {
        font-family: 'Montserrat', sans-serif;
        font-size: 55px;
        fill: #ffffff;
        filter: url(#liquidWave) url(#softGlow);
        animation: blink 2s infinite ease-in-out;
        text-transform: uppercase;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="blink-liquid">
    It's Me, Soumyadeep! 🕵️‍♂️
  </text>
</svg>
