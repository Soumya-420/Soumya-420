<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="50" height="50" rx="10" fill="#f5f5f5" stroke="#D14836" stroke-width="1" filter="url(#glow)">
    <animate attributeName="stroke-width" values="1;3;1" dur="2s" repeatCount="indefinite" />
  </rect>
  <path d="M10 15v20h30V15H10zm25 2l-10 7-10-7h20zm-20 2.4l10 7 10-7V33H15V19.4z" fill="#D14836">
