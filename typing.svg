<svg width="800" height="100" viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Wave Filter -->
    <filter id="liquidWave" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" dur="4s" values="0.01 0.05; 0.01 0.08; 0.01 0.05" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');
      
      .liquid-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 42px;
        fill: #ffffff;
        filter: url(#liquidWave) url(#softGlow);
        white-space: pre;
      }

      .cursor {
        fill: #ffffff;
        filter: url(#liquidWave) url(#softGlow);
        animation: blink 0.8s step-end infinite;
      }

      /* Typewriter Reveal */
      .typewriter-mask {
        animation: reveal 4s steps(25, end) forwards;
      }
      
      /* Cursor movement */
      .cursor-move {
        animation: moveX 4s steps(25, end) forwards;
      }

      @keyframes reveal {
        from { width: 0; }
        to { width: 680px; }
      }
      @keyframes moveX {
        from { transform: translateX(0); }
        to { transform: translateX(640px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>

    <mask id="textMask">
      <rect x="0" y="0" height="100" fill="white" class="typewriter-mask" />
    </mask>
  </defs>

  <!-- Background (Optional black rect for preview, can be transparent) -->
  <!-- <rect width="100%" height="100%" fill="#0a0a0a" /> -->

  <g transform="translate(40, 60)">
    <!-- Liquid Text -->
    <text x="0" y="0" class="liquid-text" mask="url(#textMask)">fellow &lt;cyber_warriors/&gt;!</text>
    
    <!-- Liquid Thick Cursor -->
    <rect x="5" y="-38" width="5" height="48" class="cursor cursor-move" />
  </g>
</svg>
