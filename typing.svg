<svg width="700" height="50" viewBox="0 0 700 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: 'Fira Code';
        src: local('Fira Code'), local('Courier New'), monospace;
      }
      .text-content {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 35px;
        fill: #00FFFB; /* Cyan color matching the screenshot */
        font-weight: 600;
        white-space: pre;
      }
      .cursor {
        fill: #ffffff;
        animation: blink 1s step-end infinite;
      }
      
      /* Synchronized Animations */
      .anim-mask {
        animation: reveal 3s steps(25, end) forwards;
      }
      .anim-cursor {
        animation: moveCursor 3s steps(25, end) forwards;
      }

      /* 
         Text length: "fellow <cyber_warriors/>!" is 25 chars.
         Approx width per char in monospace 35px is ~21px.
         Total width ~525px.
      */

      @keyframes reveal {
        from { width: 0; }
        to { width: 540px; }
      }
      @keyframes moveCursor {
        from { transform: translateX(0); }
        to { transform: translateX(540px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    
    <mask id="typewriter-mask">
      <rect x="0" y="0" height="50" fill="white" class="anim-mask" />
    </mask>
  </defs>

  <!-- Centering Container -->
  <g transform="translate(60, 35)">
    <!-- The Typed Text -->
    <text x="0" y="0" class="text-content" mask="url(#typewriter-mask)">fellow &lt;cyber_warriors/&gt;!</text>
    
    <!-- The Blinking Cursor (Pipe Style | ) -->
    <rect x="5" y="-32" width="3" height="40" class="cursor anim-cursor" />
  </g>
</svg>
